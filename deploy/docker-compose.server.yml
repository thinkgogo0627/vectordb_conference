# 서버(EC2 t4g.large, 8GB)용: Postgres + Kafka + Debezium Connect.
# 로컬 docker-compose.exp.yml과 같은 구성에 다음을 바꿨다.
#   - 포트는 서버 안(127.0.0.1)에서만 연다. 보안 그룹은 SSH만 연다.
#   - 자동 재시작 (unless-stopped)
#   - Postgres 데이터는 이름 있는 볼륨에 둔다 (컨테이너를 지워도 남는다)
#   - Kafka 보관 48시간. 로그는 컨테이너 안(/tmp)이라 재시작에는 남고 `down`하면 지워진다
#     (원천 메시지의 장기 보관은 R2가 맡는다)
#   - JVM 메모리 상한 (Kafka 1GB, Connect 768MB)
#
#   docker compose -f deploy/docker-compose.server.yml up -d --wait
name: market

services:
  postgres:
    image: postgres:16
    command: >
      postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
               -c shared_buffers=512MB
    environment:
      POSTGRES_USER: exp
      POSTGRES_PASSWORD: exp          # 서버 밖으로 열지 않는다
      POSTGRES_DB: exp
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exp -d exp"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
      CLUSTER_ID: market-kraft-cluster-00001
    ports: ["127.0.0.1:9092:9092"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: market-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: "-Xms256m -Xmx768m"
    ports: ["127.0.0.1:8083:8083"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
